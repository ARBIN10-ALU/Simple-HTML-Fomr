<form>
    <label for="name"> Name: </label>
    <input type="text" id="name" class="form">
<br>
    Gender:
    <label for="male">Male </label>
    <input type="radio" id="male" value="male" name="gender" class="form">

    <label for="female">Female</label>
    <input type="radio" id="female"  value="female" name="gender" class="form">


    <br>
    Hobby :
    <label for="physical activity"> Physical Activity  </label>
    <input type="checkbox" id="physical activity" value="physical activity" class="form"><br>
    <label for="video game" class="video" > Video Game  </label>
    <input type="checkbox" class="video" id="video game" value="video game" class="form"><br>
    <label for="reading" class="read"> Reading  </label>
    <input type="checkbox" class="read" id="reading" value="reading" class="form"><br>

    <label for="pass"> Password  </label>
    <input type="password" id="pass" name="password" class="form">
    <br>

    <label for="e-mail">E-Mail</label>
    <input type="email" id="e-mail" name="email" class="form">
<br>
    <button type="reset" class="bt">
        Reset
    </button>

    <button type="submit" class="bt">
        Submit
    </button>


</form>
